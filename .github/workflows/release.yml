name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release version
        run: npm test
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Package extension
        run: npm run package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes --title "Franks ConnectWise $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
