<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Franks ConnectWise Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Franks ConnectWise</h1>
    <p class="sub">Choose exactly which tools and behaviors are active.</p>

    <section aria-labelledby="appearance-heading">
      <h2 id="appearance-heading">Appearance</h2>
      <label>
        Color mode
        <select id="theme">
          <option value="system">Match system</option>
          <option value="bright">Bright</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </section>

    <section aria-labelledby="tab-rename-heading">
      <h2 id="tab-rename-heading">ConnectWise tools</h2>
      <label class="check">
        <input id="ticketLauncherEnabled" type="checkbox">
        Enable the calendar ticket opener
      </label>

      <fieldset>
        <legend>Calendar entry types</legend>
        <p class="section-help">Choose which entries Open Today's Tickets should include.</p>
        <label class="check">
          <input id="calendarType-service" type="checkbox">
          <span><span class="swatch service" aria-hidden="true"></span>Blue — Service</span>
        </label>
        <label class="check">
          <input id="calendarType-project" type="checkbox">
          <span><span class="swatch project" aria-hidden="true"></span>Brown — Project</span>
        </label>
        <label class="check">
          <input id="calendarType-meeting" type="checkbox">
          <span><span class="swatch meeting" aria-hidden="true"></span>Pink — Meeting</span>
        </label>
        <label class="check">
          <input id="calendarType-activity" type="checkbox">
          <span><span class="swatch activity" aria-hidden="true"></span>Green — Activity</span>
        </label>
        <label class="check">
          <input id="calendarType-misc-entry" type="checkbox">
          <span><span class="swatch misc-entry" aria-hidden="true"></span>Orange — Misc/Travel</span>
        </label>
      </fieldset>

      <label class="check">
        <input id="tabRenameEnabled" type="checkbox">
        Automatically rename ticket tabs from the ConnectWise ticket header
      </label>
    </section>

    <section aria-labelledby="region-heading">
      <h2 id="region-heading">Region link opener</h2>
      <p class="section-help">Press Command+Shift+X on macOS or Ctrl+Shift+X on Windows to draw over links.</p>

      <label class="check">
        <input id="regionLinkOpenerEnabled" type="checkbox">
        Enable region link selection
      </label>

      <label class="check">
        <input id="regionRemoveDuplicates" type="checkbox">
        Open duplicate destinations only once
      </label>

      <label class="check">
        <input id="regionOpenInBackground" type="checkbox">
        Open selected links in the background
      </label>

      <label class="check">
        <input id="regionGroupTabs" type="checkbox">
        Put selected links in a tab group
      </label>

      <label>
        Region tab group name
        <input id="regionGroupTitle" type="text" maxlength="80">
      </label>

      <label>
        Region tab group color
        <select id="regionGroupColor">
          <option value="blue">Blue</option>
          <option value="cyan">Cyan</option>
          <option value="green">Green</option>
          <option value="yellow">Yellow</option>
          <option value="orange">Orange</option>
          <option value="red">Red</option>
          <option value="pink">Pink</option>
          <option value="purple">Purple</option>
          <option value="grey">Grey</option>
        </select>
      </label>

      <label class="check">
        <input id="regionCollapseGroup" type="checkbox">
        Collapse the region group after opening
      </label>
    </section>

    <section aria-labelledby="group-heading">
      <h2 id="group-heading">Ticket group</h2>
      <label>
        Tab group name
        <input id="groupTitle" type="text" maxlength="80">
      </label>

      <label>
        Tab group color
        <select id="groupColor">
          <option value="purple">Purple</option>
          <option value="blue">Blue</option>
          <option value="cyan">Cyan</option>
          <option value="green">Green</option>
          <option value="yellow">Yellow</option>
          <option value="orange">Orange</option>
          <option value="red">Red</option>
          <option value="pink">Pink</option>
          <option value="grey">Grey</option>
        </select>
      </label>

      <label class="check">
        <input id="collapseGroup" type="checkbox">
        Collapse the ticket group after opening
      </label>

      <label class="check">
        <input id="keepCalendarActive" type="checkbox">
        Keep the calendar tab active after opening tickets
      </label>
    </section>

    <div class="row">
      <button id="save" type="button">Save settings</button>
      <span id="saved" role="status" aria-live="polite"></span>
    </div>
  </main>
  <script src="options.js"></script>
</body>
</html>
